<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CyberExc — Payment</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #09090b;
            color: white;

            font-family:
                Inter,
                Arial,
                sans-serif;
        }

        .card {
            width: 92%;
            max-width: 520px;

            padding: 30px;

            border: 1px solid #27272a;
            border-radius: 20px;

            background: #111113;

            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, 0.45);
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #a1a1aa;
            margin-bottom: 25px;
        }

        .info {
            padding: 15px;
            margin-bottom: 10px;

            border-radius: 12px;

            background: #18181b;
        }

        .label {
            color: #a1a1aa;
            font-size: 13px;
        }

        .value {
            margin-top: 5px;
            font-size: 17px;
            font-weight: 700;
        }

        input,
        select {

            width: 100%;

            padding: 14px;

            margin-top: 10px;

            border: 1px solid #303036;
            border-radius: 11px;

            outline: none;

            background: #18181b;
            color: white;

            font-size: 15px;
        }

        button {

            width: 100%;

            margin-top: 18px;

            padding: 15px;

            border: 0;
            border-radius: 11px;

            background: white;
            color: black;

            font-size: 15px;
            font-weight: 800;

            cursor: pointer;
        }

        button:hover {
            opacity: .9;
        }

        .warning {

            margin-top: 18px;

            padding: 14px;

            border-radius: 11px;

            background: #201b0c;

            color: #facc15;

            font-size: 13px;
            line-height: 1.5;
        }

        .message {
            display: none;

            margin-top: 18px;

            padding: 15px;

            border-radius: 11px;

            background: #172016;

            color: #86efac;
        }

        .error {
            background: #251414;
            color: #fca5a5;
        }

    </style>
</head>

<body>

<div class="card">

    <div class="logo">
        CyberExc
    </div>

    <div class="subtitle">
        Litecoin Exchange
    </div>

    <div id="loading">
        Loading order...
    </div>

    <div id="payment" style="display:none">

        <div class="info">

            <div class="label">
                Payment ID
            </div>

            <div class="value" id="orderId">
                -
            </div>

        </div>

        <div class="info">

            <div class="label">
                Amount
            </div>

            <div class="value" id="bdt">
                -
            </div>

        </div>

        <div class="info">

            <div class="label">
                USD
            </div>

            <div class="value" id="usd">
                -
            </div>

        </div>

        <div class="info">

            <div class="label">
                Demo Litecoin
            </div>

            <div class="value" id="ltc">
                -
            </div>

        </div>

        <p>
            Select your payment method and enter
            your transaction ID below.
        </p>

        <select id="method">

            <option value="">
                Select payment method
            </option>

            <option value="bKash">
                bKash
            </option>

            <option value="Nagad">
                Nagad
            </option>

        </select>

        <input
            id="trx"
            type="text"
            placeholder="Transaction ID"
        >

        <button onclick="submitPayment()">
            Submit Payment
        </button>

        <div class="warning">

            ⚠️ Submit only genuine transaction
            information. Fake or invalid transaction
            IDs may cause the order to be rejected
            or result in a warning.

        </div>

        <div id="message" class="message"></div>

    </div>

</div>

<script>

    /*
        IMPORTANT:

        Replace this with your actual Python backend.

        Example:

        https://api.example.com
    */

    const API_URL =
        "https://YOUR-PYTHON-BACKEND.com";



    function getOrderId() {

        const parts =
            window.location.pathname
            .split("/")
            .filter(Boolean);

        return parts[parts.length - 1];

    }



    async function loadOrder() {

        const orderId =
            getOrderId();

        try {

            const response =
                await fetch(
                    `${API_URL}/api/orders/${orderId}`
                );

            const data =
                await response.json();

            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Order not found"
                );

            }

            const order =
                data.order;

            document.getElementById(
                "orderId"
            ).textContent =
                "#" + order.order_id;

            document.getElementById(
                "bdt"
            ).textContent =
                "৳" +
                Number(order.bdt)
                .toLocaleString(
                    "en-US",
                    {
                        minimumFractionDigits: 2
                    }
                );

            document.getElementById(
                "usd"
            ).textContent =
                "$" +
                Number(order.usd)
                .toFixed(2);

            document.getElementById(
                "ltc"
            ).textContent =
                Number(order.ltc_amount)
                .toFixed(8) +
                " LTC";

            document.getElementById(
                "loading"
            ).style.display =
                "none";

            document.getElementById(
                "payment"
            ).style.display =
                "block";

        }

        catch (error) {

            document.getElementById(
                "loading"
            ).textContent =
                "❌ " + error.message;

        }

    }



    async function submitPayment() {

        const orderId =
            getOrderId();

        const method =
            document.getElementById(
                "method"
            ).value;

        const trx =
            document.getElementById(
                "trx"
            ).value.trim();

        const message =
            document.getElementById(
                "message"
            );

        message.classList.remove(
            "error"
        );

        if (!method) {

            showMessage(
                "Please select bKash or Nagad.",
                true
            );

            return;

        }

        if (!trx) {

            showMessage(
                "Please enter your transaction ID.",
                true
            );

            return;

        }

        try {

            const response =
                await fetch(
                    `${API_URL}/api/orders/${orderId}/payment`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            trx_id: trx,
                            payment_method: method
                        })
                    }
                );

            const data =
                await response.json();

            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Unable to submit payment."
                );

            }

            showMessage(
                "✅ Payment submitted. " +
                "Your order is waiting for manual verification."
            );

            document.getElementById(
                "method"
            ).disabled = true;

            document.getElementById(
                "trx"
            ).disabled = true;

        }

        catch (error) {

            showMessage(
                error.message,
                true
            );

        }

    }



    function showMessage(
        text,
        error = false
    ) {

        const message =
            document.getElementById(
                "message"
            );

        message.textContent =
            text;

        message.style.display =
            "block";

        if (error) {

            message.classList.add(
                "error"
            );

        }

    }



    loadOrder();

</script>

</body>

</html>
